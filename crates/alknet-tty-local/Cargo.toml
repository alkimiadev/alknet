[package]
name = "alknet-tty-local"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local TTY backend for alknet-tty: LocalTtyBackend via portable_pty (PTY mode) and std::process::Command (pipe/runner mode)"
repository.workspace = true

[lib]
name = "alknet_tty_local"

[dependencies]
alknet-tty = { path = "../alknet-tty" }
async-trait = "0.1"
portable-pty = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
futures-core = "0.3"
tracing = "0.1"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util", "macros"] }
tokio-stream = "0.1"
serde_json = "1"
tempfile = "3"